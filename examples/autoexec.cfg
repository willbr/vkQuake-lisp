// Controls for the Lisp maps. Stock Quake runs autoexec.cfg from the -game
// directory and saves config.cfg there, so these bindings stay with the mod.
bind w +forward
bind a +moveleft
bind s +back
bind d +moveright
bind leftarrow +left
bind rightarrow +right
bind f +attack
bind space +jump
bind mouse1 +attack
// Keys 1-7 select the matching status bar weapon slot. Slot 4 is empty.
bind 1 "impulse 1"
bind 2 "impulse 2"
bind 3 "impulse 3"
bind 4 "impulse 4"
bind 5 "impulse 5"
bind 6 "impulse 6"
bind 7 "impulse 7"
bind e "impulse 10"
// Stock clients send only attack and jump, so Mouse2 sends a press and a release impulse.
alias +tether "impulse 30"
alias -tether "impulse 31"
bind mouse2 +tether
alias buddy_use "impulse 20"
bind q buddy_use
alias buddy_follow "impulse 21"
alias buddy_wait "impulse 22"
alias buddy_regroup "impulse 23"
alias gameplay_trace "impulse 24"
alias tunables_reread "impulse 25"
// A parked actor offers restarts: 8 retry, 9 skip, 0 abort.
bind 8 "impulse 26"
bind 9 "impulse 27"
bind 0 "impulse 28"
bind r restart
+mlook
